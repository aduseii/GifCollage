# Rebuilds the public site whenever main changes, and publishes it to the
# gh-pages branch. Enable it once under Settings > Pages by choosing
# "Deploy from a branch" > gh-pages > / (root).
name: Build site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:static
      - name: Make it servable from a subfolder
        run: |
          cp dist-static/static.html dist-static/index.html
          cp dist-static/static.html dist-static/404.html
          rm dist-static/static.html
          touch dist-static/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-static
          publish_branch: gh-pages
